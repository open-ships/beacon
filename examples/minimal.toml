# minimal.toml — bare minimum config to get beacon running.
# Reads from can0, passes all messages to both sinks unfiltered.

[app]
log_level = "info"

[can]
interface = "can0"
bitrate   = 250000
auto_up   = false   # bring the interface up manually before starting

[buffer]
path          = "beacon.db"
max_rows      = 10000
checkpoint_ms = 500

[sinks.sse]
enabled = true
address = "0.0.0.0:8080"
path    = "/events"
filters = []   # pass everything

[sinks.tcp]
enabled = true
address = "0.0.0.0:9090"
filters = []   # pass everything

[admin]
address = "0.0.0.0:2112"
