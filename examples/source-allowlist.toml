# source-allowlist.toml — accept specific PGNs only from specific source devices.
#
# Use this when your bus has multiple sensors reporting overlapping PGNs and you
# want to designate an authoritative source for each data type — e.g. one GPS
# unit wins for position, one compass wins for heading.
#
# Source IDs are NMEA 2000 device addresses (0–251). Run `beacon --list-devices`
# or use a tool like Actisense NMEA Reader to discover the address of each device.
#
# Device map (edit to match your installation):
#   Source 1  — Primary GPS (e.g. Garmin GPS 19x)
#   Source 2  — Compass / autopilot sensor (e.g. Simrad IS40)
#   Source 3  — Engine gateway (e.g. Actisense EMU-1)
#   Source 4  — Wind / weather station
#   Source 7  — AIS receiver
#
# The filter is a single OR-chain so that each (source, pgn) pair is checked
# independently. Only messages that match at least one arm pass through.

[app]
log_level = "info"

[can]
interface  = "can0"
restart_ms = 100

[buffer]
path          = "beacon.db"
max_rows      = 50000
checkpoint_ms = 250

[sinks.sse]
enabled = true
address = "0.0.0.0:8080"
path    = "/events"
# Accept position PGNs only from the primary GPS (source 1),
# heading/attitude from the compass (source 2),
# and engine data from the engine gateway (source 3).
filters = [
  """
  (msg.source == 1 && msg.pgn in [129025, 129026, 129029])
  || (msg.source == 2 && msg.pgn in [127250, 127251, 127257])
  || (msg.source == 3 && msg.pgn in [127488, 127489, 127493, 127505, 127508])
  """,
]

[sinks.tcp]
enabled = true
address = "0.0.0.0:9090"
# TCP carries the same source-gated set plus wind and AIS from their dedicated
# sensors, and drops anything below priority 4.
filters = [
  """
  (msg.source == 1 && msg.pgn in [129025, 129026, 129029])
  || (msg.source == 2 && msg.pgn in [127250, 127251, 127257])
  || (msg.source == 3 && msg.pgn in [127488, 127489, 127493, 127505, 127508])
  || (msg.source == 4 && msg.pgn in [130306, 130310, 130311])
  || (msg.source == 7 && msg.pgn in [129038, 129039, 129794, 129809, 129810])
  """,
  "msg.priority <= 4",
]

[admin]
address = "0.0.0.0:2112"
