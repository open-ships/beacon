# high-volume.toml — tuned for a busy bus (200+ msg/s) with a large buffer
# and aggressive filtering to keep sinks from being overwhelmed.
#
# Strategy:
#   - Large SQLite buffer so fast bursts don't lose data
#   - SSE sink: position/heading rapid-updates only (very high frequency)
#   - TCP sink: full navigation + engine set, but priority-gated
#   - Short checkpoint interval so lag stays low
#   - Debug logging off to avoid I/O overhead

[app]
log_level = "warn"

[can]
interface  = "can0"
restart_ms = 50

[buffer]
path          = "beacon.db"
max_rows      = 500000     # ~2-3 minutes of data at 200 msg/s
checkpoint_ms = 100        # flush frequently to minimize replay on restart

[sinks.sse]
enabled = true
address = "0.0.0.0:8080"
path    = "/events"
# Rapid-update PGNs only: position and COG/SOG (high frequency, lightweight)
filters = [
  "msg.pgn in [129025, 129026]",
]

[sinks.tcp]
enabled = true
address = "0.0.0.0:9090"
# Broader set but gate on priority to drop low-priority chatter
filters = [
  "msg.pgn in [127250, 127488, 127489, 128259, 128267, 129025, 129026, 129029]",
  "msg.priority <= 4",
]

[admin]
address = "0.0.0.0:2112"
