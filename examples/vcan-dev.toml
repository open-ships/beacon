# vcan-dev.toml — development config using a virtual CAN interface (vcan0).
# No real CAN hardware needed. Set up vcan0 first:
#
#   sudo modprobe vcan
#   sudo ip link add dev vcan0 type vcan
#   sudo ip link set up vcan0
#
# Send test frames with cansend:
#   cansend vcan0 09F11203#FF1F00000000FFFF   (example N2K frame)
#
# Or replay a capture file:
#   canplayer -I capture.log vcan0=can0

[app]
log_level = "debug"   # verbose output during development

[can]
interface  = "vcan0"
bitrate    = 0        # ignored for virtual interfaces
auto_up    = false    # vcan0 is brought up manually above
restart_ms = 50

[buffer]
path          = "beacon-dev.db"
max_rows      = 5000
checkpoint_ms = 100

[sinks.sse]
enabled = true
address = "127.0.0.1:8080"   # loopback only during dev
path    = "/events"
filters = []   # pass all so every PGN is visible in the browser

[sinks.tcp]
enabled = true
address = "127.0.0.1:9090"
filters = []

[admin]
address = "127.0.0.1:2112"
