<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title description">
  <title id="title">Beacon delivery and checkpoint flow</title>
  <desc id="description">A message passes its connector filter, enters a durable route buffer, is delivered to a sink, and advances the checkpoint only at that sink's delivery boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40577f"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f7a4f"/></marker>
  </defs>
  <rect width="960" height="390" rx="16" fill="#f6f8fb"/>
  <text x="48" y="48" fill="#0f1219" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800">One connector owns one delivery boundary</text>
  <path d="M 190 151 H 251" stroke="#40577f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 403 151 H 468" stroke="#40577f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 671 151 H 742" stroke="#40577f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="48" y="100" width="142" height="102" rx="9" fill="#ffffff" stroke="#c8d2e1"/>
  <text x="119" y="140" text-anchor="middle" fill="#0f1219" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800">Message</text>
  <text x="119" y="169" text-anchor="middle" fill="#555555" font-family="ui-monospace, monospace" font-size="13">source receive</text>
  <rect x="251" y="100" width="152" height="102" rx="9" fill="#ffffff" stroke="#c8d2e1"/>
  <text x="327" y="140" text-anchor="middle" fill="#0f1219" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800">Filter</text>
  <text x="327" y="169" text-anchor="middle" fill="#555555" font-family="ui-monospace, monospace" font-size="13">all CEL → true</text>
  <rect x="468" y="82" width="203" height="138" rx="9" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text x="570" y="116" text-anchor="middle" fill="#0f1219" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800">SQLite route buffer</text>
  <g font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="491" y="139" width="42" height="38" rx="5" fill="#eef2f7"/><text x="512" y="164" fill="#222939">42</text>
    <rect x="542" y="139" width="42" height="38" rx="5" fill="#eef2f7"/><text x="563" y="164" fill="#222939">43</text>
    <rect x="593" y="139" width="54" height="38" rx="5" fill="#fff4df" stroke="#ddb977"/><text x="620" y="164" fill="#a65f00">44</text>
  </g>
  <text x="570" y="201" text-anchor="middle" fill="#555555" font-family="Inter, system-ui, sans-serif" font-size="13">persist before delivery</text>
  <rect x="742" y="100" width="170" height="102" rx="9" fill="#ffffff" stroke="#c8d2e1"/>
  <text x="827" y="140" text-anchor="middle" fill="#0f1219" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800">Sink boundary</text>
  <text x="827" y="169" text-anchor="middle" fill="#555555" font-family="Inter, system-ui, sans-serif" font-size="13">write, PUBACK, 2xx…</text>
  <path d="M 827 215 C 827 300, 661 306, 593 251" fill="none" stroke="#0f7a4f" stroke-width="3" marker-end="url(#green-arrow)"/>
  <rect x="439" y="280" width="257" height="66" rx="9" fill="#e8f7ef" stroke="#9fd7bd"/>
  <text x="568" y="307" text-anchor="middle" fill="#0f7a4f" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800">Advance checkpoint to 44</text>
  <text x="568" y="331" text-anchor="middle" fill="#0f7a4f" font-family="Inter, system-ui, sans-serif" font-size="13">only after the declared boundary succeeds</text>
  <text x="48" y="309" fill="#555555" font-family="Inter, system-ui, sans-serif" font-size="14">Failure?</text>
  <text x="48" y="334" fill="#222939" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">44 stays pending and retries.</text>
</svg>
