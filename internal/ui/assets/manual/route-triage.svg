<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title description">
  <title id="title">Troubleshooting decision flow for missing messages</title>
  <desc id="description">Check source reception first, then connector filtering and queue state, then sink delivery and client replay position.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40577f"/></marker></defs>
  <rect width="960" height="430" rx="16" fill="#f6f8fb"/>
  <text x="48" y="46" fill="#0f1219" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800">Trace the route in the same order messages travel</text>
  <path d="M 192 135 H 253" stroke="#40577f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 449 135 H 510" stroke="#40577f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 706 135 H 767" stroke="#40577f" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="48" y="86" width="144" height="98" rx="9" fill="#ffffff" stroke="#c8d2e1"/>
    <text x="120" y="122" text-anchor="middle" fill="#0f1219" font-size="17" font-weight="800">Source</text>
    <text x="120" y="151" text-anchor="middle" fill="#555555" font-size="13">receiving?</text>
    <rect x="253" y="86" width="196" height="98" rx="9" fill="#ffffff" stroke="#c8d2e1"/>
    <text x="351" y="122" text-anchor="middle" fill="#0f1219" font-size="17" font-weight="800">Connector</text>
    <text x="351" y="151" text-anchor="middle" fill="#555555" font-size="13">filtering or queuing?</text>
    <rect x="510" y="86" width="196" height="98" rx="9" fill="#ffffff" stroke="#c8d2e1"/>
    <text x="608" y="122" text-anchor="middle" fill="#0f1219" font-size="17" font-weight="800">Sink</text>
    <text x="608" y="151" text-anchor="middle" fill="#555555" font-size="13">accepting delivery?</text>
    <rect x="767" y="86" width="145" height="98" rx="9" fill="#ffffff" stroke="#c8d2e1"/>
    <text x="840" y="122" text-anchor="middle" fill="#0f1219" font-size="17" font-weight="800">Client</text>
    <text x="840" y="151" text-anchor="middle" fill="#555555" font-size="13">at right cursor?</text>
  </g>
  <g fill="none" stroke="#b42318" stroke-width="2.5" stroke-dasharray="5 6">
    <path d="M 120 184 V 238"/><path d="M 351 184 V 238"/><path d="M 608 184 V 238"/><path d="M 840 184 V 238"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="132" y="215" fill="#b42318" font-size="12" font-weight="800">NO</text>
    <text x="363" y="215" fill="#b42318" font-size="12" font-weight="800">NO</text>
    <text x="620" y="215" fill="#b42318" font-size="12" font-weight="800">NO</text>
    <text x="852" y="215" fill="#b42318" font-size="12" font-weight="800">NO</text>
    <rect x="32" y="238" width="176" height="130" rx="9" fill="#fff0ef" stroke="#e0aaa6"/>
    <text x="48" y="271" fill="#b42318" font-size="14" font-weight="800">Check ingress</text>
    <text x="48" y="299" fill="#222939" font-size="13">Interface or file</text><text x="48" y="322" fill="#222939" font-size="13">Gateway connection</text><text x="48" y="345" fill="#222939" font-size="13">Source diagnostics</text>
    <rect x="237" y="238" width="228" height="130" rx="9" fill="#fff0ef" stroke="#e0aaa6"/>
    <text x="253" y="271" fill="#b42318" font-size="14" font-weight="800">Check route policy</text>
    <text x="253" y="299" fill="#222939" font-size="13">Enabled + references</text><text x="253" y="322" fill="#222939" font-size="13">Filter errors / counts</text><text x="253" y="345" fill="#222939" font-size="13">Queue depth + pruning</text>
    <rect x="494" y="238" width="228" height="130" rx="9" fill="#fff0ef" stroke="#e0aaa6"/>
    <text x="510" y="271" fill="#b42318" font-size="14" font-weight="800">Check delivery</text>
    <text x="510" y="299" fill="#222939" font-size="13">Sink state + last error</text><text x="510" y="322" fill="#222939" font-size="13">Remote acknowledgement</text><text x="510" y="345" fill="#222939" font-size="13">Retry / connectivity</text>
    <rect x="751" y="238" width="177" height="130" rx="9" fill="#fff0ef" stroke="#e0aaa6"/>
    <text x="767" y="271" fill="#b42318" font-size="14" font-weight="800">Check consumer</text>
    <text x="767" y="299" fill="#222939" font-size="13">Path and protocol</text><text x="767" y="322" fill="#222939" font-size="13">Replay cursor</text><text x="767" y="345" fill="#222939" font-size="13">Client limit</text>
  </g>
  <text x="480" y="402" text-anchor="middle" fill="#555555" font-family="Inter, system-ui, sans-serif" font-size="14">The dashboard and component overviews expose each boundary without stopping the route.</text>
</svg>
