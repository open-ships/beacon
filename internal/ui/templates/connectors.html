{{define "content"}}
<div class="flex flex-col gap-4">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-semibold">Connectors</h1>
    <a class="btn btn-primary" data-variant="primary" href="/connectors/new"
       hx-get="/connectors/new" hx-target="#entity-create-dialog-container" hx-swap="innerHTML">Add connector</a>
  </div>
  <div id="connector-form-container">{{if .ConnectorForm}}{{template "connector-form" .ConnectorForm}}{{end}}</div>
  {{template "connector-panel" .}}
</div>
{{end}}
