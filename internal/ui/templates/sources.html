{{define "content"}}
<div class="flex flex-col gap-4">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-semibold">Sources</h1>
    {{if not .SourceForm}}
    <a class="btn btn-primary" href="/ui/sources/new">Add source</a>
    {{end}}
  </div>
  <div id="source-form-container">{{if .SourceForm}}{{template "source-form" .SourceForm}}{{end}}</div>
  {{if not .SourceForm}}
  {{template "source-panel" .}}
  {{end}}
</div>
{{end}}
