<!doctype html>
<html lang="en" data-obc-theme="day">
<head>
<meta charset="utf-8">
<script>
(function () {
  var saved = localStorage.getItem("beacon-obc-theme");
  if (saved) document.documentElement.setAttribute("data-obc-theme", saved);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — beacon</title>
<link rel="stylesheet" href="/ui/assets/palettes.css?v={{.AssetVersion}}">
<link rel="stylesheet" href="/ui/assets/app.css?v={{.AssetVersion}}">
<script src="/ui/assets/htmx.min.js?v={{.AssetVersion}}" defer></script>
<script src="/ui/assets/openbridge.bundle.js?v={{.AssetVersion}}" type="module"></script>
</head>
<body class="min-h-screen bg-base-100 text-base-content">
<obc-top-bar apptitle="beacon" pagename="{{.Title}}" showappsbutton showdimmingbutton></obc-top-bar>
<div id="brilliance-container" class="hidden fixed top-14 right-2 z-50">
  <obc-brilliance-menu id="brilliance-menu" variant="compact" palette="day"></obc-brilliance-menu>
</div>
<div class="drawer lg:drawer-open">
  <input id="nav-drawer" type="checkbox" class="drawer-toggle">
  <div class="drawer-content">
    <label for="nav-drawer" class="btn btn-sm drawer-button lg:hidden m-2">Menu</label>
    <main class="p-4">{{template "content" .}}</main>
  </div>
  <div class="drawer-side z-40">
    <label for="nav-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
    <ul class="menu bg-base-200 text-base-content min-h-full w-64 p-4 gap-1" hx-boost="true">
      {{range .Nav}}
      <li><a href="{{.Href}}"{{if eq .Key $.Active}} class="menu-active"{{end}}>{{.Label}}</a></li>
      {{end}}
    </ul>
  </div>
</div>
<script>
(function () {
  var topBar = document.querySelector("obc-top-bar");
  var container = document.getElementById("brilliance-container");
  var menu = document.getElementById("brilliance-menu");
  var stored = localStorage.getItem("beacon-obc-theme");
  if (stored) menu.palette = stored;
  topBar.addEventListener("dimming-button-clicked", function () {
    container.classList.toggle("hidden");
  });
  menu.addEventListener("palette-changed", function (e) {
    var value = e.detail.value;
    document.documentElement.setAttribute("data-obc-theme", value);
    localStorage.setItem("beacon-obc-theme", value);
  });
})();
</script>
</body>
</html>
