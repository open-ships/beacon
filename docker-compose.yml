services:
  beacon:
    build: .
    # host networking is required so the container can access the CAN interface
    network_mode: host
    # Administration remains on host loopback (127.0.0.1:2112). Use an SSH
    # tunnel for remote access; protect any explicit --admin-address override.
    volumes:
      # Persist the SQLite database (config + connector buffers) across restarts
      - ./data:/data
      # Optional: seed an empty database on first boot; ignored once the
      # database already holds a configuration.
      # - ./seed.json:/data/seed.json:ro
    restart: unless-stopped
    # command:
    #   - --db=/data/beacon.db
    #   - --seed=/data/seed.json
    #   - --log-level=info
    # `docker compose ps` / `docker inspect` report health from the
    # Dockerfile's own HEALTHCHECK instruction (busybox wget against the
    # admin server's /health, bundled in the alpine base image) — no
    # separate healthcheck: block needed here.
