version: 2
project_name: beacon

before:
  hooks:
    - go mod tidy

builds:
  - id: beacon
    main: ./cmd/beacon
    binary: beacon
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: beacon
    name_template: "beacon_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

release:
  # Semver tags, CalVer release names.
  name_template: '{{ .Tag }} ({{ .Now.Format "2006.01.02" }})'
