name: Release

# A successful CI run on the current main commit is the only release path.
# VERSION sets the next deliberate baseline; later releases increment patch.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main commit superseded this CI run; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reuse a semantic tag on this commit so a failed publisher can be
          # retried without consuming another patch version.
          EXISTING_TAG=$(git tag --points-at HEAD --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$EXISTING_TAG" ]; then
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_VERSION=$(tr -d '[:space:]' < VERSION)
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$BASE_VERSION"; then
            echo "VERSION must contain a semantic version without a leading v." >&2
            exit 1
          fi

          BASE_TAG="v$BASE_VERSION"
          LATEST=$(git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$LATEST" ]; then
            TAG="$BASE_TAG"
          elif [ "$LATEST" != "$BASE_TAG" ] &&
            [ "$(printf '%s\n%s\n' "$LATEST" "$BASE_TAG" | sort -V | tail -n 1)" = "$BASE_TAG" ]; then
            TAG="$BASE_TAG"
          else
            TAG=$(awk -F '[v.]' '{printf "v%d.%d.%d", $2, $3, $4 + 1}' <<< "$LATEST")
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "new_tag=true" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: ${{ steps.version.outputs.skip != 'true' && steps.version.outputs.new_tag == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

  go_artifacts:
    name: Publish Go artifacts
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch release tag
        run: git fetch origin "refs/tags/${{ needs.prepare.outputs.tag }}:refs/tags/${{ needs.prepare.outputs.tag }}"

      - name: Check for complete Go release
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          COMPLETE=true
          for ASSET in \
            "beacon_${VERSION}_darwin_amd64.tar.gz" \
            "beacon_${VERSION}_darwin_arm64.tar.gz" \
            "beacon_${VERSION}_linux_amd64.tar.gz" \
            "beacon_${VERSION}_linux_arm64.tar.gz" \
            "beacon_${VERSION}_windows_amd64.zip" \
            "beacon_${VERSION}_windows_arm64.zip" \
            checksums.txt; do
            if ! grep -Fxq "$ASSET" <<< "$ASSETS"; then
              COMPLETE=false
            fi
          done
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: ${{ steps.published.outputs.complete != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          check-latest: true

      - name: Publish archives and checksums
        if: ${{ steps.published.outputs.complete != 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker_image:
    name: Publish Docker image
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.prepare.outputs.tag }}
          tags: |
            ghcr.io/open-ships/beacon:${{ needs.prepare.outputs.tag }}
            ghcr.io/open-ships/beacon:latest

  release_gate:
    name: Require every publisher
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' }}
    needs: [prepare, go_artifacts, docker_image]
    runs-on: ubuntu-latest
    env:
      PREPARE_RESULT: ${{ needs.prepare.result }}
      GO_RESULT: ${{ needs.go_artifacts.result }}
      DOCKER_RESULT: ${{ needs.docker_image.result }}
      SKIP: ${{ needs.prepare.outputs.skip }}

    steps:
      - name: Require Go artifacts and Docker image
        shell: bash
        run: |
          set -euo pipefail
          test "$PREPARE_RESULT" = success
          if [ "$SKIP" = true ]; then
            exit 0
          fi
          test "$GO_RESULT" = success
          test "$DOCKER_RESULT" = success
