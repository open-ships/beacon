name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      runner: ${{ matrix.os }}
      command: |
        if [ "$RUNNER_OS" = Linux ]; then
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then
            printf 'gofmt needs to be run on:\n%s\n' "$fmt"
            exit 1
          fi
          go vet ./...
          CGO_ENABLED=0 go build ./...
        fi
        go test ./... -timeout 300s

  browser:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      browser: true
      command: |
        npm test

  race:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      command: |
        go test -race ./... -timeout 300s

  lint:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      lint: true

  secure:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      security: true

  vessel:
    name: Vessel resource and recovery gates
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      environment: |
        {
          "BEACON_IDLE_RSS_MAX_KIB": "65536",
          "BEACON_IDLE_FD_MAX": "32",
          "BEACON_LOAD_RSS_MAX_KIB": "98304",
          "BEACON_LOAD_FD_MAX": "32",
          "BEACON_LOAD_RATE_PER_SECOND": "50"
        }
      command: |
        bash -n scripts/vessel-release-gate.sh
        scripts/vessel-release-gate.sh

  release-gate:
    if: ${{ always() }}
    needs: [test, browser, race, lint, secure, vessel]
    uses: open-ships/ci/.github/workflows/gate.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      results: ${{ toJSON(needs) }}
